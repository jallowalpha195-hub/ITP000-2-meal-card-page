<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kombo Kitchen</title>
    <link rel="stylesheet" href="2-meal-card.css">
</head>

<body>
    <h1>Our Menu</h1>

    <div class="cards-wrapper">
        <div class="card">
            <img src="Jollof.jpg" alt="Benachin">

            <h2>Benachin</h2>

            <p>One-pot rice cooked in tomato and spices</p>

            <p class="price">D200</p>

            <button type="button">Order</button>
        </div>

        <div class="card">
            <img src="YAassa.jpg" alt="Yassa">

            <h2>Chicken Yassa</h2>

            <p>Chicken in a lemon and onion sauce, with rice</p>

            <p class="price">D300</p>

            <button type="button">Order</button>
        </div>

        <div class="card">
            <img src="Domoda.jpg" alt="Domoda">

            <h2>Domoda</h2>

            <p>Groundnut stew with meat and vegetables, and rice.</p>

            <p class="price">D250</p>

            <button type="button">Order</button>
        </div>
    </div>
</body>

</html>
